name: Compile and Publish Distribution Assets

on:
  push:
    tags:
      - 'V*' # Triggers automatically when you push a version tag like V2.0.0

permissions:
  contents: write # Grants the pipeline write access to attach assets directly to your Release panel

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull code straight from your GitHub repository branch
    - name: Checkout Code Base
      uses: actions/checkout@v4

    # 2. Spin up a clean sandbox environment targeting your spec requirement
    - name: Initialize Python Core
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # Matches your Lichess bot's core environment framework

    # 3. Pull compilation tools from the registry
    - name: Install System Build Module
      run: |
        python -m pip install --upgrade pip
        pip install build

    # 4. Generate the distribution assets natively inside the clean GitHub environment
    # This reads your online repository's pyproject.toml directly
    - name: Compile Package Archives
      run: python -m build

    # 5. Automatically create a release and attach the wheels safely
    # The 'dist/' folder lives inside this temporary workflow instance and is discarded right after
    - name: Attach Binaries to GitHub Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
