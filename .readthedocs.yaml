# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.10" # Aligns with your project's Python 3.10+ requirement

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/source/conf.py # Adjusted to match your directory layout

# Declare the Python requirements required to build your documentation
python:
   install:
   - requirements: requirements.txt # Uses your root requirements to build code modules
   - method: pip
     path: . # Installs the local Lichess bot module
