[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MakeChessBetter"
version = "2.0.0"
description = "My adaptive Lichess bot packaged as a library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "chess>=1.0.0",
    "berserk>=0.11.0"
]

[project.scripts]
inappropriate-bot = "MakeChessBetter.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
